{% extends 'leruimoveis/normal_base.html' %}

{% load static %}  

{% block content %}

    <div class="px-0 py-0 my-0 text-center">
        <div class="section bg-light" id="nossos-servicos">
            <div class="container">
                <div class="row">
                    <div class="col-lg-4 mb-5 mb-lg-0" style="margin: 30px 0px 30px 0px;">
                        {% include 'agencias/agencia-side-menu.html' %}
                    </div>  
                    <div class="col-lg-8 mb-5 mb-lg-0" style="margin: 30px 0px 60px 0px;">

                        <form>
                                
                            {% csrf_token %}

                            <div style="border:#ccc solid 1px;">
                                <ul class="list-group list-group-flush" style="text-align: left; width: 100%;">
                                    <li class="list-group-item" style="background-color: #ccc;">Perfil Imobiliário</li>
                                    <li class="list-group-item form-bg">
                                        <div class="row">
                                            <div class="col-12 mb-3">
                                                <label for="titulo" class="form-label input-titulos">Missão</label>
                                                <textarea id="missao" class="form-control" style="height: 150px">{{ sede.agencia_missao|default:'' }}</textarea>
                                            </div>
                                            <div class="col-12 mb-3">
                                                <label for="titulo" class="form-label input-titulos">Visão</label>
                                                <textarea id="visao" class="form-control" style="height: 150px">{{ sede.agencia_visao|default:'' }}</textarea>
                                            </div>
                                            <div class="col-12 mb-3">
                                                <label for="titulo" class="form-label input-titulos">Objectivo</label>
                                                <textarea id="objectivo" class="form-control" style="height: 150px">{{ sede.agencia_objectivo|default:'' }}</textarea>
                                            </div>
                                        </div>
                                    </li>
                                </ul>
                            </div>

                            <div class="col-12 perfil-bottom-btn d-flex gap-2 justify-content-center" style="margin-top: 10px;">
                                <!-- Botão eliminar (só aparece se tiver conteúdo) -->
                                <button type="button" id="btnEliminar" onclick="Eliminar()" class="btn btn-danger d-flex align-items-center justify-content-center btn-oculto" style="width: 45px; height: 45px; border-radius: 8px;">
                                    <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#FFFFFF"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
                                </button>

                                <!-- Botão guardar -->
                                <button type="button" id="btnGuardar" onclick="Guardar()" disabled class="btn btn-detalhes d-flex align-items-center justify-content-center gap-1" style="flex: 1; border-radius: 8px;">
                                    <span id="btnGuardarIcone">
                                        <svg xmlns="http://www.w3.org/2000/svg" height="20px" viewBox="0 -960 960 960" width="20px" fill="#FFFFFF"><path d="M816-672v456q0 29.7-21.15 50.85Q773.7-144 744-144H216q-29.7 0-50.85-21.15Q144-186.3 144-216v-528q0-29.7 21.15-50.85Q186.3-816 216-816h456l144 144Zm-72 30L642-744H216v528h528v-426ZM556.5-283.5Q588-315 588-360t-31.5-76.5Q525-468 480-468t-76.5 31.5Q372-405 372-360t31.5 76.5Q435-252 480-252t76.5-31.5ZM264-552h336v-144H264v144Zm-48-77v413-528 115Z"/></svg>
                                    </span>
                                    <span id="btnGuardarTexto">Guardar</span>
                                </button>
                            </div>

                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </div>

    {% include 'agencias/modais.html' %}

{% endblock %}

{% block scripts %} 
    <script type="text/javascript" src="{% static 'assets/dist/js/InformacoesAdicionaisParceiros.js' %}"></script>
{% endblock %}
