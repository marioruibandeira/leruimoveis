{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
	<title>Login V2</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
<!--===============================================================================================-->
<link rel="stylesheet" type="text/css" href="{% static 'assets/dist/lcss/main.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'assets/dist/lcss/util.css' %}">
<link rel="stylesheet" type="text/css" href="{% static 'assets/dist/lfonts/font-awesome-4.7.0/css/font-awesome.min.css' %}">

</head>
<body>
	
	<div class="limiter">
		<div class="container-login100">
			<div class="wrap-login100">
				<form class="login100-form validate-form">
					<span class="login100-form-title p-b-26">
						<a href="{% url 'home' %}">
              <img class="mb-4" src="{% static 'assets/imagem/lerui Imoveis2.png' %}" alt="Logo marca da Lerui Imóveis" width="72" height="90">
            </a>
					</span>
          <span class="login100-form-title p-b-26">Benvindo </span>
					<span class="login100-form-title p-b-48">
						<i class="zmdi zmdi-font"></i>
					</span>

					<div class="wrap-input100 validate-input" data-validate = "Valid email is: a@b.c">
						<input class="input100" type="text" name="email">
						<span class="focus-input100" data-placeholder="Email"></span>
					</div>

					<div class="wrap-input100 validate-input" data-validate="Inserir Senha">
						<span class="btn-show-pass">
							<i class="zmdi zmdi-eye"></i>
						</span>
						<input class="input100" type="password" name="pass">
						<span class="focus-input100" data-placeholder="Senha"></span>
					</div>

					<div class="container-login100-form-btn">
						<div class="wrap-login100-form-btn">
							<div class="login100-form-bgbtn"></div>
							<button class="login100-form-btn">
								Entrar
							</button>
						</div>
					</div>

					<div class="text-center p-t-115">
						<span class="txt1">
							Não tem uma conta? <a href='{% url 'registrar' %}'>Registre-se</a> 
						</span>
					</div>
				</form>
			</div>
		</div>
    <div class="text-center">
      <p class="mt-5 mb-3 text-muted">&copy; 2025 – {% now "Y" %}</p>
    </div>
	</div>
	

	
	

	

</body>
</html>
