{% extends 'leruimoveis/normal_base.html' %}

{% load static %}  

{% block content %}
  
<div class="px-0 py-0 my-0 capa-servicos">
  <div class="container marketing px-4 py-5 mt-6">
    <div class="row">
      <div class="col-lg-6" style="text-align: left;">
        <div class="col-lg-6 ">
          <h2 class="display-6 text-center mb-4 fundo-preco-colorido">Detalhes</h2>
        </div>
      </div>
      <div class="col-lg-6"></div>
    </div>
  </div>
</div>

  
  <div class="section" style="margin: 50px 0px 30px 0px;">
    <div class="container">
      <div class="row">
        <div class="col-lg-4 mb-5 mb-lg-0" data-aos="fade-up" data-aos-delay="100">
          <div class="contact-info">
            <div class="col-12 col-lg-12 " data-aos="fade-up" data-aos-delay="300">
              <div class="caixa-funcoes mb-4">
                {{servicedetails.icons|safe}}
                <br/><br/>
                <h3 class="text-black mb-3 font-weight-bold">{{ servicedetails.titulo}}</h3>
                <p class="text-black-50" style="padding-left: 0px ;">{{ servicedetails.corpo }}</p>
                <p style="padding-left:0px;padding-top:10px;"><a href="{% url 'services' %}" class="saiba-mais">Outros Serviços</a></p>
              </div>
            </div>
          </div>
        </div>
        
        <div class="col-lg-8" data-aos="fade-up" data-aos-delay="300">
          <div class="col-12 col-lg-12 section bg-light pt-0" style="border: #ccc 1px solid; border-radius: 5px;">
            <div style="padding: 15px ;">
              <h3 class="h5 text-primary mb-4">Detalhes Adicionais</h3>
              <p class="text-black-50" style="padding-left: 0px ;">{{ servicedetails.detalhes }}</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
    
{% endblock %}
